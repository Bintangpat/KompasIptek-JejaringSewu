version: '3.9'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: jejaring_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: jejaring_user
      POSTGRES_PASSWORD: jejaring_password
      POSTGRES_DB: jejaring_sewu
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jejaring_user -d jejaring_sewu"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: jejaring_redis
    restart: unless-stopped
    command: redis-server --requirepass redis_secret
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis_secret", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
